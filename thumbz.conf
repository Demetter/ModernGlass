# thumbz - seekbar thumbnails for ModernGlass
# Put this file in your mpv "script-opts" folder. Lines starting with # are comments.

# Largest thumbnail size in pixels (scaled with the display's hidpi factor)
max_width=200
max_height=200
# Scale the thumbnail size with display-hidpi-scale (yes/no)
hidpi=yes
# Draw thumbnails this much larger than they are rendered (mpv 0.38+), e.g. 1.5
display_scale=1

# Exact frame once the pointer rests on a position:
#   yes  - always (most accurate)
#   auto - only when the nearest keyframe is visibly far from the hovered time (lighter)
#   no   - keyframes only (lightest)
precise=yes
# Seconds the pointer has to rest before the exact frame is rendered
rest_delay=0.05
# Files shorter than this many seconds always use exact frames
exact_below=30

# Thumbnails pre-rendered across the whole file once the controls appear, so every
# hover shows something immediately (0 = off). Runs only while you navigate, never
# during plain playback.
storyboard=120
# At least this many seconds between storyboard thumbnails
storyboard_gap=5
# Thumbnails kept on disk for the current file (they're deleted when mpv closes)
cache_size=200

# Decoding in the background renderer:
#   auto - software decoding below 1080p, where it's quicker; from 1080p up the same
#          hardware decoder the player uses (its copy-back variant), falling back to
#          mpv's safe automatic choice, then to software decoding
#   no   - software decoding only
#   or any mpv --hwdec value, e.g. nvdec-copy (usually fastest on NVIDIA desktop GPUs)
hwdec=auto
# Decoder threads in the renderer when it decodes in software (0 = automatic)
threads=2
# Downscaling: fast_bilinear, bilinear, bicubic, area
scaler=bilinear
# HDR to SDR for thumbnails: auto, no, clip, linear, gamma, reinhard, hable, mobius
tone_mapping=auto
# Process priority of the renderer: idle, belownormal or normal
# (Windows: mpv's --priority; Linux and macOS: nice)
priority=belownormal

# Also create thumbnails for network streams / for audio files with cover art
network=no
audio=no

# Seconds without requests before the renderer quits (0 = keep it running)
idle_quit=300
# overlay-add id (0-63), only change it if another script uses 42
overlay_id=42
# mpv executable for the renderer (default: the running mpv)
mpv_path=mpv
# Folder for temporary files (empty = system temp folder)
tmp_dir=
